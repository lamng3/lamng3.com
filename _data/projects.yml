- slug: hermes
  title: Hermes
  date: 2026-09-28
  repo: lamng3/hermes
  stars: 0
  languages: [Python]
  category: Databases
  image: hermes.jpg
  blurb: text-to-SPARQL as verified planning over the query algebra
  lead: Verified query planning over the SPARQL algebra with language agents.
  body:
    - "Hermes treats a natural-language question as a planning problem over a typed SPARQL algebra: agents build the query from operators that are checked as they are composed, instead of writing query text and hoping it parses."
    - "It answers questions against a local ontology, an in-memory graph, or a live endpoint such as DBpedia, and reports results on public text-to-SPARQL benchmarks."
