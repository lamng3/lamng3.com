- slug: aegis
  title: Aegis
  date: 2026-10-14
  languages: [Python]
  category: Security
  lead: Transactional defense of ontology-grounded agents against counterfactual attacks.
  body:
    - "Agents that answer questions over a knowledge graph lean on its ontology, and on a few of its concepts far more than the rest. An attacker who edits those few can make answers wrong without touching the graph. Aegis defends the ontology the way a database defends its data: every edit is a logged transaction, health checks run on each commit, forensics measure the damage over a query workload, and recovery rolls back to the last healthy state while keeping honest edits."
    - "Work in progress; the code will be public soon."

