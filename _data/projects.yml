- slug: ontodb
  title: OntoDB
  date: 2026-10-01
  repo: lamng3/OntoDB
  stars: 1
  languages: [C++]
  category: Databases
  image: ontodb.jpg
  notable: true
  blurb: a database management system for ontologies
  stat: SPARQL over B+ trees, strict 2PL, and ARIES recovery
  lead: A database management system for ontologies. Data is RDF and the query language is SPARQL.
  body:
    - "The shell answers a SPARQL subset over B+ tree indexes with a cost-based optimizer, runs statements under strict two-phase locking, and recovers pages with ARIES after a crash, from a checksummed write-ahead log."
    - "I wrote it to learn database internals end to end, and the [book](/publications/ontodb-book/) explains each layer as it is built."
  links:
    - { label: Manual, url: "https://lamng3.com/ontodb/" }
    - { label: Book, url: "/publications/ontodb-book/" }
    - { label: GitHub, url: "https://github.com/lamng3/OntoDB" }

- slug: memcommit
  title: MemCommit
  date: 2026-10-15
  repo: lamng3/memcommit
  languages: [Python]
  category: Agents
  image: memcommit.jpg
  notable: true
  blurb: a transactional memory layer for agents
  stat: an append-only log with provenance, and sessions consolidated into notes offline
  lead: A transactional memory layer for agents. Memories live in an append-only log with provenance, so what was built on a bad premise goes stale together.
  body:
    - "Agents that remember need the full record of what happened and short notes of what matters. MemCommit keeps both in one log: sessions as they happen, and notes at paths with an index an agent reads first and five tools it can call. An offline pass finds what the agent did not think to save, and every edit is a transaction that can be previewed, audited, or undone."
    - "I built it to treat agent memory the way a database treats data, with transactions, a log, and rollback. The code, manual, and paper are public."
  links:
    - { label: Manual, url: "https://lamng3.com/memcommit/" }
    - { label: Paper, url: "/publications/memcommit/" }
    - { label: GitHub, url: "https://github.com/lamng3/memcommit" }

- slug: kroma
  title: KROMA
  date: 2025-05-05
  repo: lamng3/kroma
  stars: 7
  languages: [Python]
  category: Knowledge Graphs
  image: kroma.jpg
  notable: true
  blurb: ontology matching with knowledge retrieval and LLMs
  stat: published at ISWC 2025
  lead: Ontology matching with knowledge retrieval and large language models.
  body:
    - "KROMA matches concepts across two ontologies. For each candidate pair it retrieves the concepts' context (from the ontology graph, ConceptNet and SPARQL endpoints), asks a language model whether the two refer to the same thing, and refines the alignment as answers arrive, so later pairs are settled without asking."
    - "It was published in the Research Track of ISWC 2025, and grew out of my M.S. thesis."
  links:
    - { label: Paper, url: "https://arxiv.org/abs/2507.14032" }
    - { label: Docs, url: "https://lamng3.com/kroma/" }
    - { label: GitHub, url: "https://github.com/lamng3/kroma" }

