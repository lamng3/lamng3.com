- slug: keras-js
  title: keras-js
  date: 2026-10-19
  repo: lamng3/keras-js
  stars: 0
  languages: [TypeScript]
  category: Machine Learning
  image: keras-js.jpg
  blurb: the Keras 3 API in the browser, on WebGPU
  stat: matches Python Keras to 1e-4; .keras files move both ways
  lead: The Keras 3 API for JavaScript. Build, train and fine-tune neural networks in the browser, on WebGPU and WebAssembly.
  body:
    - "keras-js is Keras 3 written in TypeScript on top of [jax-js](https://github.com/ekzhang/jax-js), the way Keras 3 runs on JAX in Python: a model is a pure function of its weights, and every training step is differentiated with `grad` and compiled with `jit` into WebGPU or Wasm kernels. It has the same layers, `compile()` and `fit()`, masking, recurrent states, sample weights and optimizer checkpoints."
    - "It reads and writes real `.keras` files, so a model trained in Python can be fine-tuned in a browser tab and sent back. A parity suite checks predictions and optimizer steps against Keras 3.15, and five examples from keras.io run unchanged in the page."
  links:
    - { label: Website, url: "https://lamng3.com/keras-js/" }
    - { label: Examples, url: "https://lamng3.com/keras-js/examples.html" }
    - { label: GitHub, url: "https://github.com/lamng3/keras-js" }

