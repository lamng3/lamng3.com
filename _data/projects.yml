- slug: hermes
  title: Hermes
  date: 2026-09-28
  repo: lamng3/hermes
  stars: 0
  languages: [Python]
  category: Databases
  image: hermes.jpg
  blurb: text-to-SPARQL as verified planning over the query algebra
  lead: Verified query planning over the SPARQL algebra with language agents.
  body:
    - "Hermes treats a natural-language question as a planning problem over a typed SPARQL algebra: agents build the query from operators that are checked as they are composed, instead of writing query text and hoping it parses."
    - "It answers questions against a local ontology, an in-memory graph, or a live endpoint such as DBpedia, and reports results on public text-to-SPARQL benchmarks."
  links:
    - { label: Docs, url: "https://lamng3.github.io/hermes-docs/" }
    - { label: Paper, url: "https://github.com/lamng3/hermes/blob/master/paper/hermes.pdf" }
    - { label: GitHub, url: "https://github.com/lamng3/hermes" }

- slug: aegis
  title: Aegis
  date: 2026-10-14
  languages: [Python]
  category: Security
  lead: Transactional defense of ontology-grounded agents against counterfactual attacks.
  body:
    - "Agents that answer questions over a knowledge graph lean on its ontology, and on a few of its concepts far more than the rest. An attacker who edits those few can make answers wrong without touching the graph. Aegis defends the ontology the way a database defends its data: every edit is a logged transaction, health checks run on each commit, forensics measure the damage over a query workload, and recovery rolls back to the last healthy state while keeping honest edits."
    - "Work in progress; the code will be public soon."

