- slug: agentic-ontologist
  title: The Agentic Ontologist
  date: 2026-09-25
  repo: lamng3/agentic-ontologist
  stars: 0
  languages: [Python]
  category: Agents
  image: agentic-ontologist.jpg
  notable: true
  blurb: memory-augmented agents that merge two ontologies into one
  lead: Turn two ontologies into one. Agents match, extract, reason, and repair, and every decision goes to the cheapest model that can settle it.
  body:
    - "The Agentic Ontologist orchestrates memory-augmented agents for ontology engineering. Each decision is routed by cost: cheap retrieval and small models settle most of them, and only the hard ones reach a large model."
  links:
    - { label: Showcase, url: "https://lamng3.github.io/agentic-ontologist/" }
    - { label: Paper, url: "/publications/agentic-ontologist/" }
