title: Lam Nguyen
description: >-
  Lam Nguyen, researcher. Semantic data infrastructure for trustworthy AI agents, with AI for science as the main application.
url: https://lamng3.com
baseurl: ""
lang: en
timezone: America/Los_Angeles

permalink: /blog/:year/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

include:
  - _pages
  - _redirects

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - README.md
  - CLAUDE.md
  - SYNC.md
  - LICENSE
  - scripts
